name: Frontend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
        
    - name: Install dependencies
      run: npm ci
      

    - name: Build Project
      run: npm run build

    # Fails if the home page JS/CSS exceeds the gzip budget or if three.js /
    # recharts / react-youtube end up in the initial bundle again
    - name: Check bundle size
      run: npm run check:size

    # Reports Lighthouse scores (warn-only; see lighthouserc.json)
    - name: Lighthouse CI
      run: npx --yes @lhci/cli autorun

    - name: Upload Lighthouse report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lighthouse-report
        path: frontend/lhci-report
        if-no-files-found: ignore
