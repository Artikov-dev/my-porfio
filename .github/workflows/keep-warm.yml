name: Keep backend warm

# Render's free tier puts the API to sleep after 15 minutes without traffic, and the next
# visitor then waits up to ~30s for projects, chat and the contact form. A ping every
# 10 minutes keeps it awake (one always-on service fits in the free 750 hours/month).
# Set the repository secret BACKEND_HEALTH_URL, e.g. https://api.artikov.dev/health
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /health
        env:
          URL: ${{ secrets.BACKEND_HEALTH_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "BACKEND_HEALTH_URL secret is not set — skipping."
            exit 0
          fi
          curl --silent --show-error --max-time 60 --retry 2 "$URL"
