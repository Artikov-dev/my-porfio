<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roma Artikov | Full-Stack Engineer</title>
    
    <!-- Primary Meta Tags -->
    <meta name="title" content="Roma Artikov | Full-Stack Engineer" />
    <meta data-rh="true" name="description" content="I build high-performance, secure, and enterprise-grade web applications with a focus on Clean Architecture." />
    <link data-rh="true" rel="canonical" href="https://artikov.dev/" />
    <meta name="theme-color" content="#000000" />

    <!-- Apply the theme before the first paint (React would otherwise flash dark for light-mode users).
         Keep in sync with ThemeContext; its sha256 is allowed in the CSP in vercel.json. -->
    <script>(function(){try{var t=localStorage.getItem('theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}var r=document.documentElement;r.classList.toggle('dark',t==='dark');r.setAttribute('data-theme',t)}catch(e){}})()</script>

    <!-- Structured data: lets search engines show a profile card for the name -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Roma Artikov",
        "alternateName": "Ro'zimuhammad Artikov",
        "jobTitle": "Full-Stack Engineer",
        "url": "https://artikov.dev/",
        "image": "https://artikov.dev/imRA.webp",
        "address": { "@type": "PostalAddress", "addressCountry": "UZ" },
        "sameAs": [
          "https://github.com/Artikov-dev",
          "https://www.linkedin.com/in/artikovdev/",
          "https://t.me/artikov_06_tt"
        ]
      }
    </script>

    <!-- Open Graph / Facebook -->
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:url" content="https://artikov.dev/" />
    <meta data-rh="true" property="og:title" content="Roma Artikov | Full-Stack Engineer" />
    <meta data-rh="true" property="og:description" content="I build high-performance, secure, and enterprise-grade web applications with a focus on Clean Architecture." />
    <meta data-rh="true" property="og:image" content="https://artikov.dev/og_banner.jpg" />

    <!-- Twitter -->
    <meta data-rh="true" property="twitter:card" content="summary_large_image" />
    <meta data-rh="true" property="twitter:url" content="https://artikov.dev/" />
    <meta data-rh="true" property="twitter:title" content="Roma Artikov | Full-Stack Engineer" />
    <meta data-rh="true" property="twitter:description" content="I build high-performance, secure, and enterprise-grade web applications with a focus on Clean Architecture." />
    <meta data-rh="true" property="twitter:image" content="https://artikov.dev/og_banner.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
